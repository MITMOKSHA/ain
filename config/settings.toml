# =============================================================================
# 输出与行为开关
# -----------------------------------------------------------------------------
# 这个文件是可选的。删掉它，一切按默认值运行。
# =============================================================================

[output]
# 是否额外导出 Markdown 日报到 reports/。
#
# 默认 false：网页是主入口，它和日报都从 data/items.jsonl 渲染，
# 所以日报是冗余的导出格式。开启的场景：
#   - 想把日报分享给同事
#   - 想把快照推到 GitHub（Markdown 能原生渲染）
#
# 命令行临时开启：python3 -m ain fetch --markdown
write_markdown = false
