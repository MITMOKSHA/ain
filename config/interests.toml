# =============================================================================
# 兴趣画像：决定什么内容排到日报前面
# -----------------------------------------------------------------------------
# strong   命中即大幅加分（你的核心关注点）
# medium   命中加中等分（相关但不够精准）
# negative 命中扣分（噪声，比如招聘、广告、播客预告）
# cn_strong / cn_medium  中文关键词，单独一组，见下方说明
#
# 英文关键词为整词匹配、大小写不敏感；中文关键词为子串匹配（中文无空格分词）。
# 改完直接重跑 `python -m ain fetch`，不需要动代码。
# =============================================================================

[keywords]
strong = [
  # --- 厂商与模型实体名（最关键：漏掉这些会直接丢掉重大发布） ---
  "openai", "anthropic", "claude", "gemini", "deepmind", "google brain",
  "meta ai", "llama", "mistral", "deepseek", "qwen", "kimi", "glm",
  "grok", "phi", "gemma", "command r", "stable diffusion", "sora",
  "gpt", "chatgpt", "copilot", "midjourney", "perplexity", "cohere",
  "hugging face", "nvidia", "groq", "together ai", "fireworks ai",
  "cursor", "windsurf", "codex", "alphafold", "waymo", "tesla fsd",

  # --- LLM 基础与训练 ---
  "llm", "large language model", "foundation model", "transformer",
  "pretraining", "post-training", "fine-tuning", "finetuning", "lora", "qlora",
  "rlhf", "dpo", "distillation", "quantization", "quantized", "mixture of experts",
  "moe", "scaling law", "context window", "long context", "tokenizer",
  "reinforcement learning", "rlvr", "reward model", "synthetic data",
  "distributed training", "checkpoint", "gradient",

  # --- 推理与工程落地（工程背景重点） ---
  "inference", "serving", "vllm", "sglang", "tensorrt", "onnx", "llama.cpp",
  "kv cache", "paged attention", "flash attention", "speculative decoding",
  "throughput", "latency", "batching", "cuda", "triton", "gpu", "tpu",
  "memory bandwidth", "migration", "deployment", "cost per token",

  # --- 应用架构 ---
  "rag", "retrieval-augmented", "vector database", "embedding", "reranker",
  "agent", "agentic", "multi-agent", "tool use", "function calling", "mcp",
  "model context protocol", "workflow orchestration", "guardrails",
  "prompt engineering", "structured output", "evals", "evaluation",
  "benchmark", "observability", "tracing",

  # --- 模型能力 ---
  "reasoning model", "chain-of-thought", "test-time compute", "multimodal",
  "vision-language", "vlm", "diffusion", "world model", "text-to-image",
  "speech recognition", "code generation", "open weights", "open-source model",
  "coding agent", "computer use",

  # --- 世界模型 / 自监督表征（JEPA 系） ---
  # 这类工作大量发在 cs.CV，标题常不含 "llm" 等通用词，不单列会整类漏掉
  "jepa", "joint embedding predictive", "joint-embedding predictive",
  "v-jepa", "i-jepa", "world action model", "latent world model",
  "predictive architecture", "self-supervised representation",
  "energy-based model", "representation learning",
  "video world model", "model-based rl", "dynamics model",
]

# -----------------------------------------------------------------------------
# 中文关键词。必须单独配：英文关键词匹配不到中文标题，
# 否则中文源的内容会被相关性门槛整体过滤掉。
# 中文没有空格分词，这里按子串匹配（不是整词匹配），所以别放太短的词。
# -----------------------------------------------------------------------------
cn_strong = [
