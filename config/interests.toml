# =============================================================================
# 打分参数
# -----------------------------------------------------------------------------
[scoring]
half_life_hours = 60.0   # 时效半衰期：60 小时后新鲜度权重减半（越大越不看重"新"）
top_n = 30               # 日报最多显示多少条
per_source_cap = 12      # 单个信源最多占多少条，防止一家刷屏
min_score = 1.5          # 低于此分不进日报（keep_all 的官方博客不受此限）
strong_weight = 3.0      # strong 关键词基础权重
medium_weight = 1.5      # medium 关键词基础权重
negative_weight = -4.0   # negative 关键词扣分
max_age_days = 21.0      # 超过这么多天的内容再重罚一次

# 分类加权：论文和版本发布对你更有价值就调高
[category_boost]
paper = 1.0
release = 2.0
vendor = 1.5
community = 0.5
cn = 1.5          # 中文源整体略微加权，避免被英文源挤满
