# =============================================================================
# 兴趣画像：把「Agent 领域」的内容排到前面，并把非 Agent 内容挡在门外
# -----------------------------------------------------------------------------
# 这个仓库关注的不是整个 AI，而是 **Agent（智能体）** 这条线：
# 工具调用、上下文工程、记忆、编排框架、编码 Agent、计算机操作、沙箱与权限、
# Agent 评测、多智能体协作。
#
# strong   命中即大幅加分（Agent 核心概念）
# medium   命中加中等分（相关但不够精准，例如底层模型、API）
# negative 命中扣分（招聘、广告、播客预告等噪声）
# cn_strong / cn_medium  中文关键词，单独一组，见下方说明
# [domain] 硬门槛：不命中这里面任何一个词的内容，无论来自哪个信源都不收录
#
# 英文关键词为整词匹配、大小写不敏感；中文关键词为子串匹配（中文无空格分词）。
# 改完直接重跑 `python -m ain fetch`，不需要动代码。
# =============================================================================

[keywords]
strong = [
  # --- Agent 主体与形态 ---
  "agent", "agents", "agentic", "multi-agent", "multiagent", "subagent",
  "sub-agent", "ai agent", "autonomous agent", "agentic ai", "agent loop",
  "agent framework", "agent sdk", "agents sdk", "agent runtime", "agent harness",
  "agent scaffold", "scaffolding", "harness", "autonomy",

  # --- 工具调用与协议 ---
  "tool use", "tool-use", "tool calling", "tool-calling", "toolformer",
  "function calling", "function-calling", "tool integration",
  "mcp", "model context protocol", "mcp server", "mcp client",
  "a2a", "agent2agent", "agent protocol", "agent skills", "skills",

  # --- 编码 Agent / 计算机操作 ---
  "coding agent", "code agent", "claude code", "codex", "cursor", "windsurf",
  "devin", "openhands", "aider", "copilot",
  "computer use", "computer-use", "browser agent", "browser-use", "web agent",
  "gui agent", "desktop agent", "swe-bench", "swebench", "terminal-bench",
  "agent trajectory",

  # --- 编排与框架 ---
  "orchestration", "orchestrator", "agent orchestration", "agent workflow",
  "workflow orchestration", "handoff", "langgraph", "langchain", "llamaindex",
  "crewai", "autogen", "semantic kernel", "pydantic ai",

  # --- 上下文、记忆、规划 ---
  "context engineering", "context management", "agent memory",
  "long-term memory", "memory bank", "planning", "task decomposition",
  "self-reflection", "self-critique", "human-in-the-loop", "human in the loop",

  # --- 执行环境与安全 ---
  "sandbox", "sandboxing", "code execution", "execution environment",
  "prompt injection", "tool poisoning", "agent security", "agent safety",
  "guardrails", "permission", "prompt caching",

  # --- Agent 评测 ---
  "agent evaluation", "agent evals", "agent benchmark", "agentic benchmark",
  "gaia", "webarena", "osworld", "os-world", "tau-bench", "taubench",

  # --- Agent 的推理底座（值得学，但单独出现时不构成 Agent 内容） ---
  "reasoning model", "chain-of-thought", "test-time compute",
]

# -----------------------------------------------------------------------------
# 中文关键词。必须单独配：英文关键词匹配不到中文标题，
# 否则中文源的内容会被相关性门槛整体过滤掉。
# 中文没有空格分词，这里按子串匹配（不是整词匹配），所以别放太短的词。
# 注意：刻意不收「代理」（在中文里更常指 proxy）和「协议」这类歧义词。
