# =============================================================================
# 信源配置 —— 只服务于「Agent（智能体）」这一个方向
# -----------------------------------------------------------------------------
# 每个信源一段 [[source]]。字段：
#   id            唯一标识（查询和 CLI -s 过滤用得到，别随便改）
#   type          适配器类型：rss | arxiv | hackernews | html_list | hf_models | hf_blog | reddit
#   name          显示名
#   url           地址（arxiv/hackernews 等用 API 的适配器可以留空）
#   category      分类：paper | vendor | community | release | news | other
#   weight        信源权重，1.0 为基准，越高越容易排进日报
#   enabled       false 则跳过（网络不通的先禁用，别让它拖慢每次抓取）
#   keep_all      true 则跳过关键词门槛与最低分（策展型官方博客用）
#   domain_exempt true 则**连 Agent 硬门槛也跳过**。只给整站都在讲 Agent 工程
#                 的信源用；官方大厂博客不要开，否则又变成"什么都收"。
#
# Agent 硬门槛本身配在 config/interests.toml 的 [domain] 段，对所有信源生效。
# =============================================================================

# ------------------------------- 论文 / 研究 -------------------------------
# 用定向 query 在信源侧就收窄到 Agent，而不是先拉 cs.AI 全量再靠词表过滤——
# 后者既浪费配额，又会让 RL 里的 "agent"（另一个含义）混进来。
# 若想再宽一点，往 query 里加 abs:"computer use"、abs:"agent memory" 等。

[[source]]
id = "arxiv-agents"
type = "arxiv"
name = "arXiv · Agent 方向"
category = "paper"
weight = 1.6
# 豁免硬门槛：query 已经在**摘要**字段上做了 Agent 定向筛选，
# 比事后用标题再筛一遍更准。不加这一条，标题里没写 "agent" 的
# 真 Agent 论文（例如 "Mental-Models for ..."）会被自己的门槛误杀。
domain_exempt = true
# cs.SE 必须留：编码 Agent / SWE-bench 这类工作常发在这里
categories = ["cs.AI", "cs.CL", "cs.SE", "cs.MA"]
query = '(abs:"LLM agent" OR abs:"agentic" OR abs:"tool use" OR abs:"function calling" OR abs:"multi-agent" OR abs:"computer use" OR abs:"agent memory")'
limit = 60
sort_by = "submittedDate"
timeout = 45

# --------------------------- 大厂发布 / 工程博客 ---------------------------
# keep_all 只跳过关键词/分数门槛；Agent 硬门槛仍然生效。
# 但要注意门槛的真实边界：它的词表里包含 codex / claude code / mcp 这类
# **本身就是 Agent 的产品名**，所以「Oracle 用 Codex 省了多少时间」这类
# 案例文也会通过——标题里带 Agent 产品名是硬门槛能拿到的最强信号，
# 代价是这类厂商案例文会混进来（已实测，确实会）。要更干净就把它从
# [domain].keywords 里拿掉，代价是漏掉真正的 Codex Agent 更新。

[[source]]
id = "openai-news"
keep_all = true
type = "rss"
name = "OpenAI News"
url = "https://openai.com/news/rss.xml"
category = "vendor"
weight = 1.5
limit = 25

[[source]]
id = "deepmind-blog"
keep_all = true
type = "rss"
name = "Google DeepMind"
url = "https://deepmind.google/blog/rss.xml"
category = "vendor"
weight = 1.4
limit = 25

[[source]]
id = "google-ai-blog"
keep_all = true
type = "rss"
name = "Google AI Blog"
url = "https://blog.google/technology/ai/rss/"
category = "vendor"
weight = 1.2
limit = 25

# Anthropic 没有 RSS，用 HTML 列表适配器解析 /news。
[[source]]
id = "anthropic-news"
keep_all = true
type = "html_list"
name = "Anthropic News"
url = "https://www.anthropic.com/news"
category = "vendor"
weight = 1.5
limit = 15
# 捕获 href / 标题正文 / 前置日期三部分；页面改版时只需要改这一行
# 注意用 __title 锁定标题 span，否则会匹配到同级的分类/日期 span
link_pattern = '<a[^>]+href="(?P<href>/news/[a-z0-9\-]+)"[^>]*>.*?<time[^>]*>(?P<date>[^<]+)</time>.*?<span[^>]*__title[^>]*>(?P<title>[^<]{10,200})</span>'
exclude = ["/news/category", "/news/author"]

# Anthropic 的工程博客是 Agent 工程最密集的一手来源（工具设计、上下文工程、
# 多智能体、沙箱、eval）。/news 是产品公告，/engineering 才是工程深水区。
[[source]]
id = "anthropic-engineering"
keep_all = true
type = "html_list"
name = "Anthropic Engineering"
url = "https://www.anthropic.com/engineering"
category = "vendor"
weight = 1.6
limit = 25
# h2 = 置顶卡，h3 = 普通卡；summary 只在置顶卡存在，缺失时适配器会回落到标题
link_pattern = 'href="(?P<href>/engineering/[A-Za-z0-9\-]+)"[^>]*>.*?<h[23][^>]*>(?P<title>[^<]{8,200})</h[23]>(?:.*?<p[^>]*summary[^>]*>(?P<summary>[^<]{0,400})</p>)?.*?<time[^>]*>(?P<date>[^<]+)</time>'

# ------------------------------- 工程 / 社区 -------------------------------

# LangChain 官方博客：Agent 工程的一手来源（Deep Agents、harness、skills、MCP）。
# 整站基本都在讲 Agent，所以额外豁免硬门槛；但它是厂商博客，仍要防跑偏，
# 因此只开 domain_exempt，不放开其他闸门。
[[source]]
id = "langchain-blog"
keep_all = true
domain_exempt = true
type = "rss"
name = "LangChain Blog"
url = "https://blog.langchain.com/rss.xml"
category = "vendor"
weight = 1.4
limit = 20

# Simon Willison：Agent / 工具调用 / 安全的一手实践与批评，更新频繁。
# 不是 Agent-only，所以**不豁免**硬门槛，让 [domain] 过滤。
[[source]]
id = "simon-willison"
type = "rss"
name = "Simon Willison"
url = "https://simonwillison.net/atom/everything/"
category = "community"
weight = 1.3
limit = 25

# Latent.Space：Agent 与工程实践的访谈/通讯，条目少但密度高。
[[source]]
id = "latent-space"
type = "rss"
name = "Latent.Space"
url = "https://www.latent.space/feed"
category = "community"
weight = 1.1
limit = 15

# HN 是消防栓，所以适配器先用 filter_keywords 预筛再进入打分。
# 这里已经收窄到 Agent 术语，省下的是每条的拉取时间预算。
[[source]]
id = "hn-ai"
type = "hackernews"
name = "Hacker News (Agent)"
category = "community"
weight = 1.0
feed = "topstories"
scan = 90
limit = 20
min_points = 40
budget_seconds = 45
workers = 12
filter_keywords = [
  "agent", "agents", "agentic", "multi-agent", "tool use", "tool calling",
  "function calling", "mcp", "model context protocol", "claude code", "codex",
  "cursor", "langchain", "langgraph", "crewai", "autogen", "computer use",
  "browser use", "swe-bench", "coding agent", "ai agent", "agentic ai",
  "context engineering", "prompt injection", "tool poisoning", "sandbox",
]

